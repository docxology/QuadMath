name: mathematical-verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reproducible runner and video prerequisite
        run: |
          python -m pip install uv==0.13.7
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install locked dependencies
        run: uv sync --frozen --python '${{ matrix.python }}' --group dev
      - name: Tests and complete statement/branch coverage
        run: |
          uv run --frozen coverage run -m pytest -q
          uv run --frozen coverage report
      - name: Documentation contracts
        run: |
          uv run --frozen python quadmath/scripts/generate_glossary.py --check
          uv run --frozen python quadmath/scripts/validate_markdown.py --strict
          uv run --frozen python docs/development/check_links.py
      - name: Build wheel, source archive and source-rebuilt wheel with toolchain evidence
        run: |
          package_dir="$RUNNER_TEMP/quadmath-package"
          mkdir -p "$package_dir/original" "$package_dir/rebuilt" "$package_dir/proof" "$package_dir/source"
          uv --version > "$package_dir/proof/runner.txt"
          python --version >> "$package_dir/proof/runner.txt"
          python -m pip freeze > "$package_dir/proof/runner-packages.txt"
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/quadmath-builder"
          python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml","rb"))["build-system"]["requires"]))' > "$package_dir/proof/build-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/quadmath-builder/bin/python" -r "$package_dir/proof/build-requirements.txt"
          uv pip freeze --python "$RUNNER_TEMP/quadmath-builder/bin/python" > "$package_dir/proof/build-toolchain.txt"
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file "$package_dir/proof/runtime-constraints.txt"
          uv build --no-build-isolation --python "$RUNNER_TEMP/quadmath-builder/bin/python" --wheel --sdist --out-dir "$package_dir/original"
          tar -xzf "$package_dir"/original/*.tar.gz -C "$package_dir/source"
          uv build --no-build-isolation --python "$RUNNER_TEMP/quadmath-builder/bin/python" --wheel --out-dir "$package_dir/rebuilt" "$package_dir"/source/*
          sha256sum "$package_dir"/original/* "$package_dir"/rebuilt/* | sed "s|$package_dir/||" > "$package_dir/proof/sha256.txt"
      - name: Exercise both installed distributions outside the checkout
        run: |
          package_dir="$RUNNER_TEMP/quadmath-package"
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          cd "$RUNNER_TEMP"
          for kind in original rebuilt; do
            environment="$RUNNER_TEMP/quadmath-$kind"
            uv venv --python '${{ matrix.python }}' "$environment"
            uv pip install --python "$environment/bin/python" --constraint "$package_dir/proof/runtime-constraints.txt" "$package_dir/$kind"/*.whl
            uv pip freeze --python "$environment/bin/python" > "$package_dir/proof/$kind-installed.txt"
            "$environment/bin/python" -I - "$expected_version" > "$package_dir/proof/$kind-consumer.json" <<'PY'
          import json, sys
          from importlib.metadata import version
          from pathlib import Path
          import quadmath
          from fractions import Fraction
          import numpy as np
          from quadmath import (
              Quadray, centroid_exact, dot_exact, squared_distance_exact,
              affine_combination_exact, signed_tetra_volume_exact,
              triangle_area_squared_exact,
          )
          from quadmath.core.quadray import integer_tetra_volume
          from quadmath.core.metrics import kl_divergence, shannon_entropy
          from quadmath.inference.information import fisher_information_matrix
          from quadmath.stats.statistics import sample_mean, scaling_fit, scaling_predict
          assert Path(quadmath.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          installed_version = version("quadmath-project")
          assert installed_version == sys.argv[1]
          points = [Quadray(0,0,0,0), Quadray(1,0,0,0),
                    Quadray(0,1,0,0), Quadray(0,0,1,0)]
          assert integer_tetra_volume(*points) == Fraction(1,4)
          assert centroid_exact(points) == (Fraction(1,4), Fraction(1,4), Fraction(1,4), Fraction(0))
          assert np.isclose(shannon_entropy([1e308,1e308]), np.log(2))
          assert fisher_information_matrix([[4_000_000_000]])[0,0] == 1.6e19
          assert np.isfinite(kl_divergence([1,0], [np.nextafter(0.,1.),1e308], eps=0))
          raw = Fraction(np.uint64(2**63), 1)
          point = Quadray(raw,0,0,0)
          assert centroid_exact([point,point]) == (Fraction(2**63), Fraction(0), Fraction(0), Fraction(0))
          assert dot_exact(Quadray(1,1,0,0), Quadray(2**60+1,0,2**60,0)) == 2
          gauge = 2**2000
          assert squared_distance_exact(points[1], (gauge+1,gauge,gauge,gauge)) == 0
          midpoint = affine_combination_exact(points[:2], [Fraction(1,2)]*2)
          assert midpoint == (Fraction(1,2), Fraction(0), Fraction(0), Fraction(0))
          assert signed_tetra_volume_exact(points[0], midpoint, *points[2:]) == Fraction(1,8)
          assert triangle_area_squared_exact(*points[:3]) == 2
          mean = sample_mean([1e308, 1e308])
          assert mean == 1e308
          exponent, _, r_squared = scaling_fit([1,2,4], [3,12,48])
          prediction = scaling_predict([1,2,4], [3,12,48], [8])
          assert np.isclose(exponent, 2) and np.isclose(r_squared, 1)
          assert np.allclose(prediction, [192])
          print(json.dumps({"distribution": "quadmath-project", "version": installed_version,
                            "python": sys.version, "tetra_volume": str(integer_tetra_volume(*points)),
                            "triangle_area_squared": str(triangle_area_squared_exact(*points[:3])),
                            "sample_mean": mean, "scaling_prediction": np.asarray(prediction).tolist()}))
          PY
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quadmath-distributions-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/quadmath-package/original
            ${{ runner.temp }}/quadmath-package/rebuilt
            ${{ runner.temp }}/quadmath-package/proof
          if-no-files-found: error

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@498ce7030982ff0e0cecd98a8f5a7c90615b4e41
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          leanchecker: 'true'

  manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin manuscript date to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install manuscript toolchain
        run: |
          python -m pip install uv==0.13.7
          sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core ffmpeg
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.13 --group dev
      - name: Regenerate figures, data and PDFs
        run: bash quadmath/scripts/render_pdf.sh
      - name: Port and validate generated documentation
        run: |
          uv run --frozen python docs/manuscript/port_from_source.py
          uv run --frozen python docs/development/check_links.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quadmath-manuscript
          path: |
            quadmath/output/pdf/quadmath_review.pdf
            quadmath/output/tex/quadmath_review.tex
          if-no-files-found: error
