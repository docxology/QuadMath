[project]
name = "quadmath-project"
version = "0.4.0"
description = "QuadMath: Quadray coordinates, optimization on tetrahedral lattices, and information geometry"
authors = [{ name = "QuadMath Project" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.7",
  # 13.0.0 is the first Pillow release with no open advisory. Do not lower this floor.
  "pillow>=13.0.0",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "coverage>=7.0",
]

[tool.uv]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "coverage>=7.0",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadmath"]

[tool.hatch.build.targets.sdist]
exclude = ["/quadmath/output/**", "/docs/manuscript/figures/**"]
